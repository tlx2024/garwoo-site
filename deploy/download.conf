# Garwoo download host (download.garwoo.com) - Nginx site
# Serves installers and release manifests uploaded by the product repo's release tool
# (`release_tool.py publish-server`). Layout under the root:
#   /<platform>/<version>/<file>   installers, never overwritten (immutable)
#   /releases/<platform>.json      current manifest, swapped in one rename
# Port 80 (ACME + redirect) and the certificate stay with garwoo-cloud.conf, whose
# certificate already lists download.garwoo.com.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name download.garwoo.com;

    root /var/www/garwoo-download;

    ssl_certificate /etc/letsencrypt/live/garwoo-cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garwoo-cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    autoindex off;
    client_max_body_size 1k;
    add_header X-Content-Type-Options "nosniff" always;

    # Nothing to browse here; send people to the download page.
    location = / {
        return 302 https://garwoo.com/download/;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Manifests: always revalidate; the Android client fetches them cross-origin from its WebView.
    location ~ ^/releases/(windows|android)\.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Installers: versioned paths, so they can be cached for good. Range requests resume downloads.
    location ~ ^/(windows|android)/\d+\.\d+\.\d+/[A-Za-z0-9][A-Za-z0-9._-]*\.(exe|msi|apk)$ {
        types {
            application/vnd.microsoft.portable-executable exe;
            application/x-msi msi;
            application/vnd.android.package-archive apk;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
