# Garwoo 官网 (个人版) - Nginx 配置
# 覆盖域名: www.garwoo.cn (主站), garwoo.cn, garwoo.com, www.garwoo.com (跳转)

# 1. HTTP 重定向: 全站 80 端口统一重定向至 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name garwoo.cn www.garwoo.cn garwoo.com www.garwoo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.garwoo.cn$request_uri;
    }
}

# 2. HTTPS 别名跳转: garwoo.cn, garwoo.com, www.garwoo.com -> https://www.garwoo.cn
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name garwoo.cn garwoo.com www.garwoo.com;

    ssl_certificate /etc/letsencrypt/live/garwoo.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garwoo.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.garwoo.cn$request_uri;
}

# 3. HTTPS 生产主站: www.garwoo.cn
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.garwoo.cn;

    root /var/www/garwoo-www;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/garwoo.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garwoo.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml;
    gzip_min_length 1024;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /404.html {
        internal;
    }

    location ~* \.(?:css|js|woff2|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}
